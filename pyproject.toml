[project]
name = "agentic-text-2-sql"
version = "0.1.0"
description = "Text to SQL agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "chromadb>=1.5.9",
    "datasets>=5.1.0",
    "fastapi[standard]>=0.142.2",
    "jupyterlab>=4.6.4",
    "langchain>=1.4.6",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "ollama>=0.6.3",
    "pandas>=2.3.3",
    "sentence-transformers>=6.1.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
